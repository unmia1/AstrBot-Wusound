name: astrbot_plugin_wusound_tts
display_name: 悟声语音合成
short_desc: 悟声 TTS，让 AI 用真人声说话
desc: 调用悟声（wusound）TTS 把文字合成拟真人声，以 QQ 语音发送；支持命令手动合成，也可让 AI 的回复按设定概率自动转成语音；覆盖 simple-generate 接口全部官方参数（preset/language/speechRate/model/srt/stream）
version: 1.1.0
author: unmia1
repo: https://github.com/unmia1/AstrBot-Wusound
astrbot_version: ">=4.0.0"
help: |
  /语音 <文字>      把文字合成语音发出来
  /语音角色         列出账号下可用的声音及其 ID
  /语音概率 [0-100] 查看或设置自动语音概率
  /语音清理         清空本地语音缓存
  打开 auto_tts 后，机器人回复会按概率自动合成语音
